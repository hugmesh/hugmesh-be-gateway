# RENDERED from hugmesh-generator specs/cluster/charts/hugmesh-gateway
# (templates/configmap.yaml) with the be-gateway routes from apps/20-gateway-be.yaml.
# The gateway loads this application-routes.yml via SPRING_CONFIG_ADDITIONAL_LOCATION
# (file:/config/). The Deployment mounts THIS ConfigMap (by fixed name) at /config.
# Kept verbatim — Forgejo-cutover dark copy; see ../hugmesh-deploy.yaml.
#
# TODO: this route table (no bare Path=/** entry) diverges from this repo's own
# application-be.yml (a single Path=/** catch-all). Verified byte-identical to
# the live render on 2026-06-23 only -- re-sync against the source Helm chart
# before the Forgejo cutover relies on it. See README's Known Gaps section.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hugmesh-be-gateway-routes
  labels:
    app.kubernetes.io/name: hugmesh-be-gateway
    app.kubernetes.io/instance: hugmesh-be-gateway
    app.kubernetes.io/part-of: hugmesh.systems
    app.kubernetes.io/component: gateway
    helm.sh/chart: hugmesh-gateway-0.1.0
data:
  # Loaded via SPRING_CONFIG_ADDITIONAL_LOCATION; merges over the image's
  # baked-in application.yml. Defines this gateway's downstream routes.
  application-routes.yml: |
    spring:
      cloud:
        gateway:
          # SCG 5.0 (Spring Boot 4) moved route config to
          # spring.cloud.gateway.server.webflux.*; the legacy spring.cloud.gateway.routes
          # prefix binds nothing under SCG 5.0, so these downstream routes must live
          # under server.webflux to be honoured.
          server:
            webflux:
              routes:
                - id: headscale-forward
                  uri: http://hugmesh-pki-gateway.hugmesh-pki.svc.cluster.local:8080
                  predicates:
                    - Host=scale.hugmesh.systems
                - id: mastodon-oauth
                  uri: https://akkoma-proxy.hugmesh-backend.svc.cluster.local:4443
                  predicates:
                    - Host=mastodon.hugmesh.systems
                    - Path=/oauth/**
                - id: mastodon-api
                  uri: https://akkoma-proxy.hugmesh-backend.svc.cluster.local:4443
                  predicates:
                    - Host=mastodon.hugmesh.systems
                    - Path=/api/v1/**
                - id: mastodon-web
                  uri: https://akkoma-proxy.hugmesh-backend.svc.cluster.local:4443
                  predicates:
                    - Host=mastodon.hugmesh.systems
                - id: matrix-api
                  uri: https://tuwunel-proxy.hugmesh-backend.svc.cluster.local:4443
                  predicates:
                    - Host=matrix.hugmesh.systems
                    - Path=/_matrix/**
                - id: matrix-wellknown
                  uri: https://tuwunel-proxy.hugmesh-backend.svc.cluster.local:4443
                  predicates:
                    - Path=/_matrix/**
                - id: matrix
                  uri: https://tuwunel-proxy.hugmesh-backend.svc.cluster.local:4443
                  predicates:
                    - Host=matrix.hugmesh.systems
                - id: games
                  uri: http://hugmesh-games.hugmesh-games.svc.cluster.local:8080
                  predicates:
                    - Host=games.hugmesh.systems
                - id: games-servers-console
                  uri: http://games-instances-console.hugmesh-games-instances.svc.cluster.local:8080
                  predicates:
                    - Path=/games/servers/**
                - id: federation-api
                  uri: https://hugmesh-federation-api.hugmesh-backend.svc.cluster.local:8080
                  predicates:
                    - Path=/api/federation/**
                - id: hugmesh-api
                  uri: https://hugmesh-api.hugmesh-backend.svc.cluster.local:8080
                  predicates:
                    - Path=/api/**
