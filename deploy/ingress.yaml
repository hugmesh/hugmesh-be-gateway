# RENDERED from hugmesh-generator specs/cluster/charts/hugmesh-gateway
# (templates/service.yaml ingress block) with the be-gateway ingress values from
# apps/20-gateway-be.yaml (className nginx, host api.hugmesh.net, extraHosts
# scale./games.hugmesh.net). The in-cluster nginx Ingress is the SECONDARY
# path; Cloudflare Tunnel (manifests/cloudflared) is the primary external edge.
# Kept verbatim — Forgejo-cutover dark copy; see ../hugmesh-deploy.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hugmesh-be-gateway
  labels:
    app.kubernetes.io/name: hugmesh-be-gateway
    app.kubernetes.io/instance: hugmesh-be-gateway
    app.kubernetes.io/part-of: hugmesh.net
    app.kubernetes.io/component: gateway
    helm.sh/chart: hugmesh-gateway-0.1.0
spec:
  ingressClassName: nginx
  rules:
    - host: "api.hugmesh.net"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hugmesh-be-gateway
                port:
                  number: 8080
    - host: "scale.hugmesh.net"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hugmesh-be-gateway
                port:
                  number: 8080
    - host: "games.hugmesh.net"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hugmesh-be-gateway
                port:
                  number: 8080
