spring:
  application:
    name: hugmesh-be-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CASDOOR_ISSUER_URI:https://id.hugmesh.systems}
  cloud:
    gateway:
      # SCG 5.0 (Spring Boot 4) moved route config to
      # spring.cloud.gateway.server.webflux.* — the legacy spring.cloud.gateway.routes
      # prefix binds NOTHING under SCG 5.0 (silent empty list), so this fallback
      # route must live under server.webflux to be honoured.
      #
      # NOTE: this route is also seeded into the gateway_routes table via
      # liquibase/changelog/001-gateway-routes.xml (DB-backed RouteDefinitionRepository).
      # Keep both definitions in sync if the URI/predicate ever changes.
      #
      # TODO: this single Path=/** catch-all is only THIS repo's overlay
      # contribution. The route table actually mounted on the live pod
      # (deploy/configmap.yaml, snapshotted 2026-06-23) is sourced from the
      # Helm chart in hugmesh-generator and has no bare catch-all at all.
      # Reconcile which is authoritative -- see README's Known Gaps section.
      server:
        webflux:
          routes:
            - id: be-default
              uri: ${DOWNSTREAM_URI:http://hugmesh-api.hugmesh-backend.svc.cluster.local:8080}
              predicates:
                - Path=/**
