name: Release

# Builds the be-gateway overlay image and publishes it to GHCR
# (ghcr.io/hugmesh/hugmesh-be-gateway). Mirrors the build this repo's
# .gitlab-ci.yml performs (docker build off the sibling hugmesh-gateway image via
# the GATEWAY_IMAGE build-arg), but publishes to GHCR instead of the in-cluster
# GitLab registry.
#
# The version lives in the VERSION file; a tag must equal "v" + that version.
# The release channel comes from the TAG (scripts/release-channel.sh decides
# every case below and is tested by scripts/test-release-channel.sh):
# hugmesh-release-channels: beta+stable
#
#   push to main                   -> :main and :sha-<12 hex>
#   push to release/X.Y            -> :sha-<12 hex> only (the same main-style run
#                                     the release script checks before it tags)
#   push of tag vX.Y.Z-beta.N      -> :X.Y.Z-beta.N, :beta and :sha-<12 hex>,
#                                     plus a GitHub prerelease (never Latest).
#                                     The commit must be on main.
#   push of tag vX.Y.Z (stable)    -> :X.Y.Z, :X.Y, :latest and :sha-<12 hex>,
#                                     plus a GitHub release marked Latest. The
#                                     commit must be on release/X.Y. A patch on an
#                                     older line (a newer stable vA.B.C is
#                                     published) moves :X.Y but not :latest, and
#                                     its GitHub release is not marked Latest.
#   workflow_dispatch on main, a release/X.Y branch or a v* tag
#                                  -> same as the push; for a tag, an image or
#                                     GitHub release that already exists is left
#                                     alone (the re-run path)
#   anything else                  -> refused by the version job (this includes
#                                     release/<anything that is not X.Y>)
#
# :X.Y.Z is never overwritten; the floating tags :beta, :X.Y and :latest move.
# Every tag a run pushes points at one digest, and that digest is signed and
# attested.
#
# The version job only refuses early. "Re-run failed jobs" reuses its outputs,
# however old they are, and a newer stable can publish while a run is in
# progress, so whether :X.Y and :latest move is decided again by the same script
# right before the push and right before gh release create. No later job reads
# the version job's answer, so a re-run cannot move a floating tag to an older
# line. A window of seconds remains between that check and the registry write
# (a registry has no compare-and-swap); if a concurrent run wins it, the digest
# check below fails that run.
#
# There is no pull_request trigger, and there must never be one: the publish jobs
# may run on the org's self-hosted runner, and a self-hosted runner must never run
# code from a pull request. Jobs use the self-hosted runner only when the repo
# variable RUNS_ON_PUBLISH is set AND the event is a push or dispatch on main or a
# v* tag; release/X.Y branch runs always go to GitHub-hosted runners.

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gateway_image:
        description: >
          Override the hugmesh-gateway base image (GATEWAY_IMAGE build-arg) for a
          main or release/X.Y branch build only. Leave empty to use the pinned base in
          PINNED_GATEWAY_IMAGE. A tag (release) run refuses any other base.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/hugmesh/hugmesh-be-gateway
  # The hugmesh-gateway base image this overlay builds FROM. Always an exact
  # published version: never :beta, :main or :latest. Raise it in the same PR
  # that raises VERSION.
  PINNED_GATEWAY_IMAGE: ghcr.io/hugmesh/hugmesh-gateway:0.3.0-beta.1

jobs:
  version:
    # RUNS_ON_PUBLISH is a repo variable holding a JSON array of runner labels
    # (for example ["self-hosted","Linux","X64"]). It is used only for main, v* tags
    # and studio-v* tags, never for a pull request; when it is unset, or for any
    # other ref, the job runs on the GitHub-hosted ubuntu-latest. Deleting the
    # variable is the off switch for the self-hosted runner.
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.decide.outputs.version }}
      kind: ${{ steps.decide.outputs.kind }}
      channel: ${{ steps.decide.outputs.channel }}
      line: ${{ steps.decide.outputs.line }}
      sha12: ${{ steps.decide.outputs.sha12 }}
      gateway_image: ${{ steps.decide.outputs.gateway_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the release channel rules
        run: bash scripts/test-release-channel.sh

      # deploy/configmap.yaml: a route that relays a Host to another gateway must
      # carry PreserveHostHeader (hugmesh-generator#622). Needs python3 + PyYAML;
      # a missing PyYAML fails this step, it does not skip it.
      - name: Check gateway relay routes preserve the Host header
        run: bash scripts/test-route-relay-host.sh

      # Every value from outside reaches the shell through env, never by expression
      # interpolation inside run: (an expression there is pasted into the script text).
      - name: Read VERSION and decide what this run publishes
        id: decide
        env:
          INPUT_GATEWAY_IMAGE: ${{ inputs.gateway_image }}
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            pull_request|pull_request_target)
              echo "::error::this workflow never runs for a pull request"
              exit 1
              ;;
          esac

          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi
          if [ "$(wc -l < VERSION)" -ne 1 ]; then
            echo "::error::VERSION must hold exactly one line, ending in a newline"
            exit 1
          fi
          version="$(head -n 1 VERSION)"
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          if ! [[ "${version}" =~ ${semver} ]]; then
            echo "::error::VERSION '${version}' is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-<pre-release> (no '+build' part, no spaces)"
            exit 1
          fi
          case "${version}" in
            *SNAPSHOT*)
              echo "::error::VERSION '${version}' is a SNAPSHOT; a published version is immutable"
              exit 1
              ;;
          esac

          # Channel, branch rules and image tags: scripts/release-channel.sh. It
          # refuses any ref but main, release/X.Y and v<VERSION>, a beta tag off
          # main, a stable tag off release/X.Y, and any version that is not
          # X.Y.Z or X.Y.Z-beta.N.
          out="$(VERSION="${version}" VERSION_FILE=VERSION bash scripts/release-channel.sh)"
          kind="$(printf '%s\n' "${out}" | sed -n 's/^kind=//p')"
          case "${kind}" in
            main|branch|release) ;;
            *)
              echo "::error::scripts/release-channel.sh gave no usable kind ('${kind}')"
              exit 1
              ;;
          esac

          gateway_image="${PINNED_GATEWAY_IMAGE}"
          if [ -n "${INPUT_GATEWAY_IMAGE}" ]; then
            case "${INPUT_GATEWAY_IMAGE}" in
              *[!A-Za-z0-9._/:@-]*|-*)
                echo "::error::gateway_image '${INPUT_GATEWAY_IMAGE}' is not an image reference"
                exit 1
                ;;
            esac
            if [ "${kind}" = release ] && [ "${INPUT_GATEWAY_IMAGE}" != "${PINNED_GATEWAY_IMAGE}" ]; then
              echo "::error::a release builds only on the pinned base ${PINNED_GATEWAY_IMAGE}; change PINNED_GATEWAY_IMAGE in a PR instead of overriding it"
              exit 1
            fi
            gateway_image="${INPUT_GATEWAY_IMAGE}"
          fi
          if [ "${kind}" = release ]; then
            # A release pins an exact base: a version tag or a digest, never a moving tag.
            base_ref_re='(:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?|@sha256:[0-9a-f]{64})$'
            if ! [[ "${gateway_image}" =~ ${base_ref_re} ]]; then
              echo "::error::a release needs an exact base image version or digest, not '${gateway_image}'"
              exit 1
            fi
          fi

          echo "${out}"
          echo "gateway_image=${gateway_image}"
          {
            printf '%s\n' "${out}"
            echo "gateway_image=${gateway_image}"
          } >> "${GITHUB_OUTPUT}"

  image:
    needs: version
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
      GATEWAY_IMAGE: ${{ needs.version.outputs.gateway_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the base image can be pulled
        run: |
          if [ -z "$GATEWAY_IMAGE" ]; then
            echo "::error::gateway_image is empty; pass a hugmesh-gateway image reference"
            exit 1
          fi
          if ! docker manifest inspect "$GATEWAY_IMAGE" >/dev/null 2>&1; then
            echo "::error::cannot pull base image $GATEWAY_IMAGE (missing tag or package access). Publish that hugmesh-gateway version first (its Release workflow on its v* tag), and grant this repository Read under that package's Manage Actions access."
            exit 1
          fi

      # Only the immutable :X.Y.Z (or :X.Y.Z-beta.N) is checked here. The
      # floating tags :beta, :X.Y and :latest are meant to move to a newer
      # release, so they are not.
      - name: Refuse to overwrite a published version
        id: exists
        run: |
          set -uo pipefail
          if [ "$KIND" != release ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="$IMAGE_NAME:$VERSION"
          if out="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::notice::$ref is already published; it is not rebuilt or overwritten"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            case "$VERSION" in
              *-*) next="raise the beta number in VERSION" ;;
              *) next="cut the next patch release from release/${VERSION%.*}" ;;
            esac
            echo "::error::$ref is already published. A published version is never overwritten: $next instead."
            exit 1
          fi
          case "$out" in
            *": not found"*)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Fail closed: an auth or network error must not look like "absent".
              # A package that has never been pushed also lands here; publish
              # main first (it creates the package), then re-run this tag.
              echo "::error::could not tell whether $ref exists: $out"
              exit 1
              ;;
          esac

      # Builds now and pushes nothing, so the step that pushes finds every layer
      # in the builder's cache and takes seconds. The tag check below would
      # otherwise be as old as the whole build by the time the tags are written.
      - name: Build the image (no push)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: false
          build-args: |
            GATEWAY_IMAGE=${{ needs.version.outputs.gateway_image }}

      - name: Compute tags and labels
        id: meta
        if: steps.exists.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # scripts/release-channel.sh decides the tag list here, right before
          # the push, not in the version job: beta -> :X.Y.Z-beta.N + :beta;
          # stable -> :X.Y.Z plus :X.Y and :latest when nothing newer is
          # published on its line / on any line; every run adds :sha-<12>.
          out="$(VERSION_FILE=VERSION bash scripts/release-channel.sh)"
          echo "$out"
          tags="$(printf '%s\n' "$out" | sed -n '/^image_tags<<EOF_IMAGE_TAGS$/,/^EOF_IMAGE_TAGS$/p' | sed '1d;$d')"
          move_latest="$(printf '%s\n' "$out" | sed -n 's/^move_latest=//p')"
          if [ -z "$tags" ]; then
            echo "::error::scripts/release-channel.sh computed no image tags"
            exit 1
          fi
          while IFS= read -r t; do
            case "$t" in
              "$IMAGE_NAME":?*) ;;
              *) echo "::error::unexpected image tag '$t'"; exit 1 ;;
            esac
          done <<< "$tags"
          if [ "$KIND" = release ]; then
            label_version="$VERSION"
          else
            label_version="$GITHUB_REF_NAME"
          fi
          # The base image carries its own OCI labels; these override them so the
          # package links to this repo and records which base it was built on.
          {
            echo "move_latest=$move_latest"
            echo "tags<<EOF_TAGS"
            echo "$tags"
            echo "EOF_TAGS"
            echo "labels<<EOF_LABELS"
            echo "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.version=$label_version"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.base.name=$GATEWAY_IMAGE"
            echo "EOF_LABELS"
          } >> "$GITHUB_OUTPUT"
          echo "Tags:"
          echo "$tags"

      - name: Build and push image
        id: build
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        env:
          # No build-record upload: it is a separate artifact upload that can fail
          # the job after a successful push, and nothing here reads it.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          build-args: |
            GATEWAY_IMAGE=${{ needs.version.outputs.gateway_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- signed-images-20261021 ---
      # Everything below signs what the step `build` just pushed, by DIGEST, from
      # this GitHub-hosted job: a cosign keyless signature (Sigstore, GitHub OIDC),
      # a SLSA build-provenance attestation and an SPDX SBOM attestation, both
      # pushed next to the image. A run that skipped the build (existing release
      # tag) skips all of it.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_TAGS: ${{ steps.meta.outputs.tags }}
          MOVE_LATEST: ${{ steps.meta.outputs.move_latest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.loads(os.environ.get("METADATA") or "{}")
          digest = os.environ.get("DIGEST", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(f"::error::build step gave no usable digest: {digest!r}")
          names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
          repos, tags = set(), []
          for n in names:
              head, _, last = n.rpartition("/")
              if ":" in last:
                  last, tag = last.split(":", 1)
                  tags.append(tag)
              repos.add(f"{head}/{last}")
          if len(repos) != 1:
              sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
          expected = sorted(t.rpartition(":")[2] for t in os.environ.get("EXPECTED_TAGS", "").split() if t)
          if sorted(tags) != expected:
              sys.exit(f"::error::pushed tags {sorted(tags)} are not the computed tags {expected}")
          # :latest only for a stable version that owns it (MOVE_LATEST from the
          # check right before the push). The "-" fallback makes a missing or EMPTY VERSION fail
          # closed (a job output that was never set arrives as "", not unset).
          if "latest" in tags and ("-" in (os.environ.get("VERSION") or "-") or os.environ.get("MOVE_LATEST") != "true"):
              sys.exit("::error::a :latest tag was pushed; beta images and older-line patches must never be tagged latest")
          repo = repos.pop()
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"signing {repo}@{digest} (tags: {', '.join(tags)})")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      # cosign and the attestations bind to the digest, so they cover every tag
      # that resolves to it. Prove each pushed tag does (a floating tag moved
      # by a concurrent run would not).
      - name: Check every pushed tag resolves to the signed digest
        if: steps.signref.outcome == 'success'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            # A digest is the sha256 of the manifest's exact bytes, which --raw
            # prints. Do not use --format '{{.Manifest.Digest}}': buildx answers
            # any format that starts with {{.Manifest with its full listing.
            if ! raw_sha="$(docker buildx imagetools inspect "$ref" --raw | sha256sum)"; then
              echo "::error::could not read $ref from the registry"
              exit 1
            fi
            got="sha256:${raw_sha%% *}"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$ref resolves to $got, not the signed digest $DIGEST"
              exit 1
            fi
            echo "$ref -> $DIGEST (signed)"
          done <<< "$TAGS"

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          {
            echo "### Signed image"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|heads/release/[0-9]+[.][0-9]+|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [version, image]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GATEWAY_IMAGE: ${{ needs.version.outputs.gateway_image }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # beta -> prerelease, never Latest. stable -> a full release, marked
      # Latest only when nothing newer is published on any line (gh would
      # otherwise pick Latest by date and mislabel an older-line patch). That is
      # decided here, right before the release is created: a newer stable may
      # have published since the image job, or days ago if this is a re-run.
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::release ${tag} already exists; leaving it alone"
            exit 0
          fi
          notes="Image: ${IMAGE_NAME}:${VERSION}"$'\n'"Built on: ${GATEWAY_IMAGE}"
          args=(--repo "${GITHUB_REPOSITORY}" --verify-tag --title "${tag}")
          case "$VERSION" in
            *-*) args+=(--prerelease --latest=false) ;;
            *)
              out="$(VERSION_FILE=VERSION bash scripts/release-channel.sh)"
              echo "$out"
              move_latest="$(printf '%s\n' "$out" | sed -n 's/^move_latest=//p')"
              if [ "$move_latest" = true ]; then
                args+=(--latest)
              else
                args+=(--latest=false)
              fi
              ;;
          esac
          # The two-line notes go last, after every flag.
          gh release create "${tag}" "${args[@]}" --notes "${notes}"

  # --- signed-images-20261021 ---
  # After the GitHub Release of a v<version> tag run, ask hugmesh.github.io to
  # rebuild its downloads data (contract: .wf-scripts results downloads/
  # DISPATCH-CONTRACT.md). The payload is informational; the site re-reads
  # GitHub itself. Needs the SITE_DISPATCH_TOKEN secret (a token allowed to
  # write contents on hugmesh/hugmesh.github.io); without it this job prints a
  # notice and succeeds. Never runs on a push to main.
  notify-site:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify hugmesh.github.io (repository_dispatch releases-updated)
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the hugmesh.github.io releases-updated notification"
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"event_type": "releases-updated", "client_payload": {"source": os.environ["GITHUB_REPOSITORY"], "kind": "image", "version": os.environ["GITHUB_REF_NAME"][1:], "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"]}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hugmesh/hugmesh.github.io/dispatches \
            -d "$payload"
          echo "sent releases-updated for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
